<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MN&J Labs — Command Center</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --bg:#0d0c14; --bg2:#12111c;
    --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.028);
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
    --ink:#f4f2ee; --ink2:#c3bfd4; --muted:#8b87a3;
    --clay:#FF7A4A; --gold:#FFB43D; --purple:#8B82F5;
    --ok:#3DD9A4; --blue:#5AB0FF; --warn:#FFC168; --red:#FF6B6B;
    --glow:0 0 0 .5px rgba(255,255,255,.07), 0 10px 40px -12px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* icons */
  .ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

  /* ---------- aurora backdrop ---------- */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aurora b{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5}
  .aurora .b1{width:620px;height:620px;background:#D85A30;top:-220px;left:-120px;animation:drift1 22s ease-in-out infinite}
  .aurora .b2{width:560px;height:560px;background:#534AB7;top:-140px;right:-160px;animation:drift2 26s ease-in-out infinite}
  .aurora .b3{width:520px;height:520px;background:#EF9F27;bottom:-260px;left:34%;opacity:.28;animation:drift3 30s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,60px) scale(1.14)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,80px) scale(1.1)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-70px) scale(1.18)}}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 0);background-size:3px 3px}
  .shell{position:relative;z-index:2}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;padding:14px 24px;
    border-bottom:.5px solid var(--line);background:rgba(13,12,20,.66);backdrop-filter:blur(18px) saturate(160%);
    position:sticky;top:0;z-index:20}
  header .home{font-size:13px;color:var(--muted);text-decoration:none;font-weight:500;transition:color .15s;
    white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  header .home:hover{color:var(--ink)}
  header .home .ic{width:15px;height:15px}
  .brand{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .brand .m{color:var(--clay)}.brand .n{color:var(--gold)}.brand .j{color:var(--purple)}
  header .sep{width:1px;height:16px;background:var(--line)}
  header .tag{font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
  header .live{margin-left:auto;font-size:11.5px;color:var(--ok);display:inline-flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:99px;background:rgba(61,217,164,.09);border:.5px solid rgba(61,217,164,.22);white-space:nowrap}
  header .live .d{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
  @media(max-width:760px){header .tag,header .sep{display:none} header .live{font-size:10.5px;padding:4px 9px}}

  /* ---------- hero ---------- */
  .hero{max-width:1240px;margin:0 auto;padding:30px 24px 6px;display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:center}
  .hero h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-1px;margin:0 0 10px}
  .hero h1 .grad{background:linear-gradient(100deg,var(--clay),var(--gold) 48%,var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:14.5px;color:var(--ink2);line-height:1.65;margin:0 0 18px;max-width:52ch}
  .stage{position:relative;height:290px;border-radius:22px;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%,rgba(139,130,245,.20),transparent 65%),var(--panel2);
    border:.5px solid var(--line);box-shadow:var(--glow)}
  .stage::after{content:"";position:absolute;inset:auto 0 0 0;height:70px;
    background:linear-gradient(to top,rgba(13,12,20,.7),transparent);pointer-events:none}
  .stage model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
  .stage .hint{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:10.5px;color:var(--muted);z-index:3;letter-spacing:.3px}
  .stage .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
  @media(max-width:900px){.hero{grid-template-columns:1fr}.stage{height:230px}.hero h1{font-size:27px}}

  /* ---------- KPI strip ---------- */
  .kpis{max-width:1240px;margin:0 auto;padding:14px 24px 4px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi{position:relative;padding:15px 17px;border-radius:16px;background:var(--panel);
    border:.5px solid var(--line);backdrop-filter:blur(10px);overflow:hidden;transition:transform .2s,border-color .2s}
  .kpi:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18)}
  .kpi::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:.85}
  .kpi .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .kpi .k .ic{width:15px;height:15px;color:var(--ac)}
  .kpi .v{font-size:27px;font-weight:700;letter-spacing:-.8px;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .u{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
  .kpi .spark{margin-top:9px;height:22px;display:block;width:100%}

  /* ---------- layout ---------- */
  .wrap{display:grid;grid-template-columns:236px 1fr;gap:22px;padding:22px 24px 60px;max-width:1240px;margin:0 auto}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .nav{display:flex;flex-direction:column;gap:7px;position:sticky;top:78px;align-self:start}
  @media(max-width:900px){.nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
  .nav button{display:flex;align-items:center;gap:11px;font:inherit;font-size:13.5px;font-weight:600;text-align:left;
    padding:11px 13px;border-radius:14px;border:.5px solid transparent;background:transparent;color:var(--ink2);
    cursor:pointer;transition:all .18s;white-space:nowrap}
  .nav button:hover{background:var(--panel2);color:var(--ink)}
  .nav button.on{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:var(--glow)}
  .nav button.on .box{box-shadow:0 0 16px -2px var(--ac)}
  .nav .box{width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--acbg);color:var(--ac);transition:box-shadow .2s}
  .nav .box .ic{width:16px;height:16px}
  .nav .sub{font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:1px}

  /* ---------- view ---------- */
  .view{min-width:0}
  .vh{font-size:21px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
  .vs{font-size:13.5px;color:var(--muted);margin:0 0 18px}
  .fx>*{animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards}
  .fx>*:nth-child(1){animation-delay:.02s}.fx>*:nth-child(2){animation-delay:.07s}
  .fx>*:nth-child(3){animation-delay:.12s}.fx>*:nth-child(4){animation-delay:.17s}
  .fx>*:nth-child(5){animation-delay:.22s}.fx>*:nth-child(6){animation-delay:.27s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .card{position:relative;background:var(--panel);border:.5px solid var(--line);border-radius:18px;padding:17px 19px;
    margin:0 0 13px;backdrop-filter:blur(10px);transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
  .card h3{font-size:13.5px;font-weight:700;margin:0 0 13px;display:flex;align-items:center;gap:9px;letter-spacing:-.1px}
  .card h3 .ic{width:17px;height:17px;color:var(--ac,var(--muted))}
  .card h3 .r{margin-left:auto;font-weight:500}
  .row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:13px;border-bottom:.5px solid var(--line2);align-items:center}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted);flex-shrink:0}
  .row .v{text-align:right;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;color:var(--ink2);line-height:1.55}
  .row a{color:var(--blue);text-decoration:none}.row a:hover{text-decoration:underline}
  code{background:rgba(255,255,255,.08);padding:1.5px 6px;border-radius:5px;font-size:11.5px}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    letter-spacing:.3px;white-space:nowrap}
  .pill.ok{background:rgba(61,217,164,.13);color:var(--ok);border:.5px solid rgba(61,217,164,.28)}
  .pill.blue{background:rgba(90,176,255,.13);color:var(--blue);border:.5px solid rgba(90,176,255,.28)}
  .pill.warn{background:rgba(255,193,104,.13);color:var(--warn);border:.5px solid rgba(255,193,104,.28)}
  .pill.red{background:rgba(255,107,107,.13);color:var(--red);border:.5px solid rgba(255,107,107,.28)}
  .pill.mut{background:rgba(255,255,255,.07);color:var(--muted);border:.5px solid var(--line)}

  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--gold));
    width:0;animation:fill 1.1s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes fill{to{width:var(--w)}}

  .proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}
  .pcard{position:relative;background:var(--panel);border:.5px solid var(--line);border-radius:18px;padding:17px 18px;
    display:flex;flex-direction:column;backdrop-filter:blur(10px);overflow:hidden;transition:transform .22s,border-color .22s}
  .pcard:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.2)}
  .pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac);opacity:.75}
  .pcard .ph{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .pcard .pi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;background:var(--acbg);color:var(--ac)}
  .pcard .pi .ic{width:19px;height:19px}
  .pcard .pn{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
  .pcard .pt{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pcard .pd{font-size:12.5px;color:var(--ink2);line-height:1.6;margin:0 0 12px;flex:1}
  .stack{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
  .stack span{font-size:10.5px;background:rgba(255,255,255,.07);color:var(--ink2);padding:3px 8px;border-radius:7px;
    border:.5px solid var(--line2)}
  .plink{font-size:12px;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .plink .ic{width:14px;height:14px}
  .plink:hover{text-decoration:underline}
  .loc{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;display:flex;align-items:center;gap:6px;margin:3px 0}
  .loc .ic{width:13px;height:13px}
  /* Under Development */
  .wl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);text-decoration:none;
      padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.06);border:.5px solid var(--line);transition:all .15s}
  .wl:hover{border-color:var(--ac);color:var(--ink);background:rgba(255,255,255,.1)}
  .wl .ic{width:14px;height:14px;color:var(--ac)}
  .wreq{width:100%;font:inherit;font-size:12.5px;padding:10px 12px;border-radius:10px;border:.5px solid var(--line);
        background:rgba(255,255,255,.04);color:var(--ink);resize:vertical;min-height:60px}
  .wreq:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .wreq::placeholder{color:var(--muted)}
  .wsend{margin-top:9px;font:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:10px;border:0;
         background:var(--ac);color:#0d0c14;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .wsend:hover{filter:brightness(1.08)}
  .wsend .ic{width:14px;height:14px}
  .cmd{margin:5px 0}
  .cmd .cl{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .cmd code{display:block;font-family:ui-monospace,monospace;font-size:11.5px;color:#c9f5e6;background:rgba(0,0,0,.35);
    border:.5px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;word-break:break-all;transition:border-color .15s}
  .cmd code:hover{border-color:var(--ac)}
  .kv{display:flex;gap:12px;padding:6px 0;border-bottom:.5px solid var(--line2);align-items:baseline}
  .kv .kk{flex:0 0 132px;font-size:11.5px;color:var(--muted)}
  .kv .vv{flex:1;font-size:12px;color:var(--ink2);word-break:break-all;text-decoration:none}
  .kv a.vv{color:var(--blue)} .kv a.vv:hover{text-decoration:underline}
  .kv code.vv{font-family:ui-monospace,monospace;cursor:pointer;background:rgba(255,255,255,.06);padding:3px 7px;border-radius:6px}
  .kv code.vv:hover{background:rgba(255,255,255,.12);color:var(--ink)}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:9px;padding:9px 11px;
    background:rgba(255,255,255,.04);border-left:2px solid var(--ac);border-radius:0 8px 8px 0}
  .copied{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#3DD9A4;color:#04231b;
    font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:99px;z-index:99;box-shadow:0 8px 26px -8px rgba(0,0,0,.8)}
  /* infra tiles — compact, click to expand */
  .infra{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;margin:0 0 14px}
  .itile{background:var(--panel);border:.5px solid var(--line);border-radius:15px;padding:13px 14px;cursor:pointer;
    backdrop-filter:blur(10px);transition:transform .18s,border-color .18s;position:relative;overflow:hidden}
  .itile:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24)}
  .itile.open{border-color:var(--ac)}
  .itile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac);opacity:.8}
  .itile .ih{display:flex;align-items:center;gap:9px}
  .itile .ib{width:31px;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;background:var(--acbg);color:var(--ac)}
  .itile .ib .ic{width:16px;height:16px}
  .itile .inm{font-size:12.5px;font-weight:700;letter-spacing:-.1px}
  .itile .isb{font-size:10.5px;color:var(--muted);margin-top:1px}
  .itile .ich{margin-left:auto;color:var(--muted);transition:transform .2s}
  .itile .ich .ic{width:15px;height:15px}
  .itile.open .ich{transform:rotate(180deg)}
  .itile .imt{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
  .itile .imv{font-size:15px;font-weight:700}
  .itile .iex{font-size:10.5px;color:var(--muted)}
  /* Under Development tiles — same collapse behaviour as .itile, roomier when open */
  .wipg{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-items:start}
  .wtile.open{grid-column:1/-1}
  .wtile .idet{max-height:none}
  .wmini{height:3px;border-radius:99px;background:rgba(255,255,255,.09);margin-top:10px;overflow:hidden}
  .wmini i{display:block;height:100%;border-radius:99px}
  .wact{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .wact .wsend{flex:1;min-width:130px}
  .wsend.okb{background:#1f9d6b;color:#fff}
  .wsend.errb{background:rgba(255,107,107,.16);color:#FF8F8F;border:.5px solid rgba(255,107,107,.5);font-size:11px}
  .wsend:disabled{opacity:.85;cursor:default}
  .wsend.alt{background:transparent;border:.5px solid var(--line);color:var(--ink2)}
  .wsend.alt:hover{border-color:var(--ac);color:#fff}
  .wattach{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}
  .wclip{font:inherit;font-size:11.5px;font-weight:600;border:.5px dashed var(--line);background:transparent;
    color:var(--ink2);border-radius:9px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .wclip:hover{border-color:var(--ac);color:#fff}
  .wfiles{font-size:10.5px;color:var(--muted);min-width:0}
  .wfiles b{color:var(--ink2);font-weight:600}
  .wclear{font:inherit;font-size:12px;border:0;background:transparent;color:var(--err);cursor:pointer;padding:0 3px}
  .wmail{margin-top:8px;font-size:10.5px;color:var(--muted)}
  .wmail code{cursor:pointer;color:var(--ink2)}
  .idet{display:none;margin:12px -14px -13px;padding:12px 14px 13px;background:rgba(0,0,0,.28);border-top:.5px solid var(--line)}
  .itile.open .idet{display:block}
  .iwarn{margin-top:10px;font-size:10.5px;color:#FFC168;background:rgba(255,193,104,.1);border-left:2px solid #FFC168;
    border-radius:0 7px 7px 0;padding:7px 9px;line-height:1.5}
</style>
</head>
<body>
<div class="aurora"><b class="b1"></b><b class="b2"></b><b class="b3"></b></div>
<div class="grain"></div>

<div class="shell">
<header>
  <a class="home" href="/"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M5 12l6 6M5 12l6-6"/></svg>
    <span class="brand"><span class="m">M</span><span class="n">N</span>&amp;<span class="j">J</span> Labs</span></a>
  <span class="sep"></span><span class="tag">Command Center</span>
  <span class="live"><span class="d"></span> live · us-east-1 · acct 876762733422</span>
</header>

<section class="hero">
  <div>
    <h1>Everything we ship,<br><span class="grad">on one screen.</span></h1>
    <p>Projects, cloud infrastructure, databases and quality — the live state of MN&amp;J Labs.
       Humans and AI, shipping together.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <span class="pill ok">2 services running</span>
      <span class="pill blue">1 live product</span>
      <span class="pill warn">~$35 / mo</span>
    </div>
  </div>
  <div class="stage">
    <div class="load" id="mvload">loading 3D…</div>
    <model-viewer id="mv" src="/models/dashboard.glb" loading="eager" camera-controls disable-zoom
      interaction-prompt="none" exposure="1.15" shadow-intensity="0.5"
      camera-orbit="12deg 76deg 100%" field-of-view="30deg"
      min-camera-orbit="-55deg 55deg auto" max-camera-orbit="55deg 95deg auto"></model-viewer>
    <div class="hint">drag to rotate</div>
  </div>
</section>

<section class="kpis" id="kpis"></section>

<div class="wrap">
  <nav class="nav" id="nav"></nav>
  <div class="view" id="view"></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const GYM_URL = "http://gymmanger-alb-835878002.us-east-1.elb.amazonaws.com";

/* ---------- inline SVG icon set (Tabler-style, 24x24 stroke) ---------- */
const ICONS = {
  rocket:'M4 13a8 8 0 0 1 7 7a6 6 0 0 0 3-5a9 9 0 0 0 6-8a3 3 0 0 0-3-3a9 9 0 0 0-8 6a6 6 0 0 0-5 3M7 14a6 6 0 0 0-3 6a6 6 0 0 0 6-3M15 9h.01',

function sparkPath(vals,w,h){
  const mx=Math.max(...vals), mn=Math.min(...vals), rg=(mx-mn)||1;
  return vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w, y=h-((v-mn)/rg)*(h-3)-1.5;
    return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }).join(' ');
}
function renderKpis(){
  $('kpis').innerHTML = KPIS.map((k,i)=>`
    <div class="kpi" style="--ac:${k.ac}">
      <div class="k">${ico(k.icon)} ${k.k}</div>
      <div class="v"><span class="num" data-to="${k.v}">0</span><span class="u">${k.u}</span></div>
      <svg class="spark" viewBox="0 0 120 22" preserveAspectRatio="none" aria-hidden="true">
        <path d="${sparkPath(k.spark,120,22)}" fill="none" stroke="${k.ac}" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" opacity=".85"
          style="stroke-dasharray:400;stroke-dashoffset:400;animation:dash 1.3s ${0.15*i}s cubic-bezier(.2,.8,.3,1) forwards"/>
      </svg>
    </div>`).join('');
  countUp();
}
function countUp(){
  document.querySelectorAll('.num').forEach(el=>{
    const to = +el.dataset.to; let cur = 0; const step = Math.max(1, Math.round(to/28));
    const t = setInterval(()=>{ cur += step; if(cur>=to){cur=to; clearInterval(t);} el.textContent = cur; }, 26);
  });
}

/* Single-quote-safe for the inline onclick attributes above. */
function esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function cp(el){
  const t = el.textContent.trim();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>{
    const n = document.createElement('div'); n.className='copied'; n.textContent='copied ✓';
    document.body.appendChild(n); setTimeout(()=>n.remove(), 1200);
  }).catch(()=>{
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
}
function reqText(id, app){
  const t = (document.getElementById('req-'+id)||{}).value || '';
  if(!t.trim()){ alert('Type the extra requirements first.'); return null; }
  return `Extra requirements for the ${app} application (currently under development):\n\n${t}\n\n`
    + `Assess them against the current build, say what changes in the data model / API / app, estimate the effort, and flag anything risky before we build it.`;
}
/* Read the picked files into base64. Browser-side only — the file never leaves
   the machine until Send is pressed, and the server never touches a disk path. */
const MAX_ATTACH_MB = 20;
function readFiles(input){
  const files = Array.from(input?.files || []);
  if(!files.length) return Promise.resolve([]);
  const total = files.reduce((n,f) => n + f.size, 0);
  if(total > MAX_ATTACH_MB * 1024 * 1024){
    return Promise.reject(new Error(`attachments are ${(total/1048576).toFixed(1)} MB, limit is ${MAX_ATTACH_MB} MB`));
  }
  return Promise.all(files.map(f => new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('could not read ' + f.name));
    // result is a data: URL — everything after the comma is the base64 payload.
    fr.onload = () => resolve({ filename: f.name, contentBase64: String(fr.result).split(',')[1] });
    fr.readAsDataURL(f);
  })));
}

/* Show what is attached, with a way to clear it. */
document.addEventListener('change', e => {
  if(!e.target.matches('input[type=file][id^="file-"]')) return;
  const id = e.target.id.slice(5);
  const out = document.getElementById('files-' + id);
  const files = Array.from(e.target.files || []);
  if(!files.length){ out.innerHTML = ''; return; }
  const bytes = files.reduce((n,f) => n + f.size, 0);
  const size = bytes < 1048576 ? `${Math.max(1, Math.round(bytes/1024))} KB` : `${(bytes/1048576).toFixed(1)} MB`;
  out.innerHTML = files.map(f => `<b>${f.name.replace(/[<>&]/g,'')}</b>`).join(', ')
    + ` · ${size} `
    + `<button class="wclear" onclick="clearFiles('${id}')" title="remove">×</button>`;
});
function clearFiles(id){
  document.getElementById('file-'+id).value = '';
  document.getElementById('files-'+id).innerHTML = '';
}

/* Email the requirement to the team member, From michaelbu@mnjlabs.com.
   Sends through the local server (/mail/send → Google Workspace SMTP) and
   reports the real result on the button — no silent failures. */
async function sendReq(id, app, agent){
  const m = TEAM[agent] || {};
  if(!m.email){ alert('No email address on file for ' + agent + '.'); return; }
  const t = (document.getElementById('req-'+id)||{}).value || '';
  if(!t.trim()){ alert('Type the extra requirements first.'); return; }

  const btn = document.getElementById('snd-'+id);
  const original = btn.innerHTML;
  const set = (txt, cls) => { btn.innerHTML = txt; btn.className = 'wsend' + (cls ? ' ' + cls : ''); };
  set('Sending…'); btn.disabled = true;

  // Attachments: read the picked files in the browser and send them base64 in the
  // JSON body. Nothing is uploaded until you press Send.
  let attachments = [];
  try {
    attachments = await readFiles(document.getElementById('file-'+id));
  } catch(e) {
    set('Failed — ' + e.message, 'errb');
    setTimeout(()=>{ set(original); btn.disabled = false; }, 5000);
    return;
  }

  // Subject carries the provenance; the body is purely what was typed.
  // The team signature is appended server-side in /mail/send.
  try {
    const r = await fetch('/mail/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        to: m.email,
        subject: `Sent from the MN&J Labs Command Center · application: ${app}`,
        body: t.trim(),
        attachments
      })
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    set('Sent to ' + m.label + (attachments.length ? ` + ${attachments.length} file ✓` : ' ✓'), 'okb');
    setTimeout(()=>{ set(original); btn.disabled = false; }, 2600);
  } catch(e){
    set('Failed — ' + e.message, 'errb');
    console.error('[mail]', e);
    setTimeout(()=>{ set(original); btn.disabled = false; }, 5000);
  }
}
/* Go to the team member's own page, carrying the requirement with it so the
   typed text is not lost in the redirect (the page renders it as a hand-off
   banner). Requirement text is optional here — the page opens either way. */
function openTeamPage(id, app, agent){
  const m = TEAM[agent];
  if(!m || !m.page){ alert('No team page on file for ' + agent + '.'); return; }
  const t = (document.getElementById('req-'+id)||{}).value || '';
  location.href = m.page + (t.trim()
    ? '?app=' + encodeURIComponent(app) + '&q=' + encodeURIComponent(reqText(id, app))
    : '');
}

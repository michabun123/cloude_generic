# PostgreSQL profile — activate with: --spring.profiles.active=postgres
# NOTE (DataGrip): tick / make visible the "test_small" schema of database "testSmall"
#       so migrated tables are shown.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testSmall
    driver-class-name: org.postgresql.Driver
    username: tsm
    password: tsm123

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        default_schema: test_small
        format_sql: false

  flyway:
    enabled: true
    schemas: test_small            # named schema
    default-schema: test_small
    create-schemas: true           # create the schema if it does not exist
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/testSmall
    user: tsm
    password: tsm123

apiVersion: apps/v1
kind: Deployment
metadata:
  name: testprepsmallhello
  labels:
    app: testprepsmallhello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testprepsmallhello
  template:
    metadata:
      labels:
        app: testprepsmallhello
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: testprepsmallhello
          image: testprepsmallhello:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "postgres"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/testSmall"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://smallT:smallT@mongo:27017/smallTest?authSource=admin"
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
